<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Loading Lightning Craft</title><script>(()=>{const root=new URL('../',location.href);fetch(new URL('features.html',root)).then((response)=>{if(!response.ok)throw new Error('Unable to load page');return response.text();}).then((html)=>{document.open();document.write(html.replace('<head>','<head><base href="'+root.href+'">'));document.close();}).catch(()=>{document.body.textContent='Unable to load this page.';});})();</script></head><body></body></html>
